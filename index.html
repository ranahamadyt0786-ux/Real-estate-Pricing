<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI رئیل اسٹیٹ پرائسنگ ٹول</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: right; direction: rtl; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 10px; margin-top: 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; text-align: center; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h1>پراپرٹی پرائس ایسٹیمیٹر</h1>
    <label for="area">رقبہ (مربع فٹ):</label>
    <input type="number" id="area" placeholder="مثلاً 2250">

    <label for="location">مقام / شہر:</label>
    <input type="text" id="location" placeholder="مثلاً لاہور">

    <button onclick="calculatePrice()">قیمت کا تخمینہ لگائیں</button>

    <div id="result"></div>
</div>

<script>
    function calculatePrice() {
        const area = document.getElementById('area').value;
        const location = document.getElementById('location').value;
        if(area && location) {
            // یہاں API انٹیگریشن یا منطق آئے گی
            const dummyRate = 5000; 
            const estimatedTotal = area * dummyRate;
            document.getElementById('result').innerText = `تخمینی قیمت: ${estimatedTotal.toLocaleString()} روپے`;
        } else {
            alert('براہ کرم تمام معلومات درج کریں۔');
        }
    }
</script>

</body>
</html>
